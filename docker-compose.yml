services:

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    user: "${UID}:${GID}"
    ports:
      - ${BACKEND_PORT}:5000
    environment:
      - HOME=${HOME}
      - UV_CACHE_DIR=/tmp/uv-cache
      # Proxy
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${http_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${http_proxy}
      - NO_PROXY=${no_proxy}${NO_PROXY_APPEND}
      - no_proxy=${no_proxy}${NO_PROXY_APPEND}
    volumes:
      - ./src/backend:/app/src/backend
      - ./tasks:/app/tasks
      # codex custom prompts
      - ${HOME}/.codex/prompts:${HOME}/.codex/prompts
      # project directory
      - ${HOME}/ghq:${HOME}/ghq
      - ${HOME}/app:${HOME}/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    user: "${UID}:${GID}"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5555"
    environment:
      - HOME=/tmp
      - NPM_CONFIG_CACHE=/tmp/.npm
      - VITE_API_PROXY_TARGET=http://backend:5000
      # Proxy
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${http_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${http_proxy}
      - NO_PROXY=${no_proxy}${NO_PROXY_APPEND}
      - no_proxy=${no_proxy}${NO_PROXY_APPEND}
    ports:
      - "${FRONTEND_PORT}:5555"
    volumes:
      - ./src/frontend:/app/src/frontend
      - ./src/frontend/.node_modules_container:/app/src/frontend/node_modules
    restart: unless-stopped
    depends_on:
      - backend

