services:

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    user: "${UID}:${GID}"
    ports:
      - ${BACKEND_PORT}:5000
    environment:
      - HOME=${HOME}
      - UV_CACHE_DIR=/tmp/uv-cache
      # Proxy
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${http_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${http_proxy}
      - NO_PROXY=${no_proxy}${NO_PROXY_APPEND}
      - no_proxy=${no_proxy}${NO_PROXY_APPEND}
    volumes:
      - ./src/backend:/app/src/backend
      - ./tasks:/app/tasks
      # project directory
      - ${HOME}/ghq:${HOME}/ghq
      - ${HOME}/app:${HOME}/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    user: "${UID}:${GID}"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:5000
      # Proxy
      - HTTP_PROXY=${http_proxy}
      - HTTPS_PROXY=${http_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${http_proxy}
      - NO_PROXY=${no_proxy}${NO_PROXY_APPEND}
      - no_proxy=${no_proxy}${NO_PROXY_APPEND}
    ports:
      - "${FRONTEND_PORT}:5555"
    volumes:
      - ./src/frontend:/app/src/frontend
    restart: unless-stopped
    depends_on:
      - backend
