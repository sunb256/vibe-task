task_file: tasks.yml
verbose: false

codex:
  command: codex
  args:
    - app-server
    - --listen
    - stdio://

thread:
  personality: pragmatic
  service_name: task-yml-runner

prompts:
  common: |
    必要なら不足情報を確認してから作業してください。
  defaults:
    cwd: .
    approval_policy: on-request
    sandbox: workspace-write

reply_wanted:
  mode: harfauto
  max_auto_reply_count: 3
  suffixes:
    - "?"
    - "？"
  patterns:
    - 答えて
    - 回答は
    - 入力して
    - 選んで
    - 番号で答えて
    - 指定して
    - 教えて
    - A/B/C
    - 1/2/3
    - どうぞ
