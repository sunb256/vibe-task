task_file: tasks.yml

codex:
  command: codex
  args:
    - app-server
    - --listen
    - stdio://

thread:
  personality: pragmatic
  service_name: task-yml-runner

reply_wanted:
  suffixes:
    - "?"
    - "？"
  patterns:
    - 答えて
    - 回答は
    - 入力して
    - 選んで
    - 番号で答えて
    - 指定して
    - 教えて
    - A/B/C
    - 1/2/3
    - どうぞ
