verbose: false

codex:
  command: codex
  args:
    - app-server
    - --listen
    - stdio://

thread:
  personality: pragmatic
  service_name: task-yml-runner

prompts:
  # task_file: tasks.yml
  task_file: ../../tasks/projects/vibe-task/action.yml
  defaults:
    cwd: .
    approval_policy: on-request
    sandbox: workspace-write
  common: |
    1. 最初にカントフォルダのフォルダ名を取得して下さい (@PWDとする)
       また、ベースフォルダは ~/ghq/github.com/sunb256/vibe-task です(@BASE_DIRとする)

    2. 今回のタスクは @BASE_DIR/tasks/projects/@PWD/action.yml task.id: の `一番小さい番号` です

    3. AGENTS.md と @BASE_DIR/tasks/projects/@PWD/action.yml に従って実装して下さい

    4. 実装方法は、~/.codex/implement.md に従って実装して下さい

    5. 完了後は AGENTS.md に従って lint/test/typecheck を実行し、その結果を要約して下さい
       使用するツールは AGENTS.md を参照して実施

    6. 次に差分を self-review し、必要な修正をして下さい

    7. 最後に AGENTS.md に記載の レビュー方法を行い、PR して下さい

    8. タスクが完了したら、'id'と同じコードに 'title' と 'url' を追加して PR のタイトルと URL を追加し、
       @BASE_DIR/tasks/projects/@PHD/done.yml へ作業タスク1つを移動して下さい

    9. 完了後、PR のタイトルと URL を提示して下さい


reply_wanted:
  mode: harfauto
  max_auto_reply_count: 4
  suffixes:
    - "?"
    - "？"
  patterns:
    - 答えて
    - 回答は
    - 入力して
    - 選んで
    - 番号で答えて
    - 指定して
    - 教えて
    - A/B/C
    - 1/2/3
    - どうぞ
    - 確認させて
