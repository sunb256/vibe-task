impl_rule: |
  # 実装ルール（可読性基準）

  1. 関数は原則 35 行以内、超える場合は貴務で分割。
  2. if はカード節優先で、ネストは最大2段まで。
  3. 変数名、関数名は長すぎる場合は、基本はMax3ワードまで、シンプルな表現を用いる。
  4. 連切な改行を行う。
  5. KISS/DRY/リーダブルコードの原則を守る

