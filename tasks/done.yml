task:
  - id: 1
    url: https://github.com/sunb256/impl/pull/1
    title: task YAML 管理アプリの一覧・編集機能を追加
    action: |
      このリポジトリは Vite + React + TypeScript + React Router + ESLint + Prettier + Tailwind CSS で構成されたフロントエンドアプリと
      Python+Flask+uvのバックエンド構成のアプリです。
      ymlファイルを編集、閲覧するタスク管理用のWEBアプリです。
      2つの画面があります。
        - TOP画面
        - プロジェクト画面

      TOP画面:
      TOPページにProject一覧画面があり、Project一覧はリスト形式で表示します。
      これをユーザが対象プロジェクトを選択します。
      NEWボタンでプロジェクトを作成
      項目は以下
        - name
        - リポジトリフォルダ
        - action-listパス(ymlファイルパス。リポジトリフォルダから相対で指定する、デフォルトはtasks/action.yml)
        - done-listパス(ymlファイルパス。リポジトリフォルダから相対で指定する、デフォルトはtasks/done.yml)
      
      プロジェクト画面:
      対象プロジェクトの画面ではタスクの一覧が表示されます。これは表構造で表示します。

      タスクの構成は以下です。
      action.ymlの内容です
      ```
      impl_rule: |
      # 実装ルール...

      task:
        - id: 1
          url: -
          title: -
          action: |
            action 1 ...
        - id: 2
          url: -
          title: -
          action: |
            action 2 ...
      ```

      done.ymlの内容
      ```
      task:
        - id: 1
          url: -
          title: -
          action: |
            action 1 ...
        - id: 2
          url: -
          title: -
          action: |
            action 2 ...
      ```

      action.ymlとdone.ymlのtask部を全て抽出し、各項目を分かりやすく表示します。(actionとdoneはわかるようにしておく必要がある)
      各レコードはEDITボタンとDELETEボタンを持ち、EDITボタンを押下すると、編集画面が表示されます。monaco-editorでこれを編集できます。

      UPDATEで対象レコードが所属するファイルが更新保存されます。
