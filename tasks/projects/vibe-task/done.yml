  - id: '94'
    url: https://github.com/sunb256/vibe-task/pull/95
    title: projects.ymlのtaskパス設定を廃止しプロジェクト別taskファイルを自動生成
    action: |
      ファイル構成を大きく変更します。
      
      今までprojects.yml内に
      
          actionListPath: tasks/action.yml
          doneListPath: tasks/done.yml
      
      という項目を各プロジェクトに持っていたがこれを止めて以下の仕様にします。
      
      tasks/
        ├── projects
            ├── /xxx-project
                   ├── action.yml
                   ├── done.yml
            ├── /yyy-project
                   ├── action.yml
                   ├── done.yml
        └── projects.yml
      
      つまり、各プロジェクトごとのデータ(action, done.yml)を本アプリ内で保持する仕様に変更する
      
      プロジェクトの新規作成時にプロジェクトが登録されたらこれを自動で作成すること

